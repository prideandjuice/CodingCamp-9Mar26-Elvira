<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="greeting-text">
                <p id="greetingSmall">Good morning,</p>
                <h1 id="userName" style="cursor: pointer;" title="Click to edit your name">Click to add your name</h1>
                <p id="currentTime" style="font-size: 1.2rem; color: var(--text-secondary); margin-top: 0.5rem;"></p>
            </div>
            <div class="header-icons">
                <button class="icon-btn" id="themeToggle">🌙</button>
                <button class="icon-btn">🔍</button>
            </div>
        </div>

        <div class="content">
            <!-- Focus Timer Card -->
            <div class="card timer-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-clock"></i> Focus Timer</h2>
                    <button class="settings-btn" id="timerSettingsBtn">⚙️</button>
                </div>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button class="control-btn" id="startBtn"><i data-lucide="play"></i></button>
                    <button class="control-btn" id="stopBtn"><i data-lucide="pause"></i></button>
                    <button class="control-btn" id="resetBtn"><i data-lucide="rotate-ccw"></i></button>
                </div>
                <div class="timer-settings hidden" id="timerSettings">
                    <input type="number" id="timerMinutes" min="1" max="60" value="25">
                    <span>minutes</span>
                </div>
            </div>

            <!-- To-Do List Section -->
            <div class="section-header">
                <h2>Tasks</h2>
                <button class="text-btn" id="sortBtn">Sort</button>
            </div>
            
            <div class="todo-input-card">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button id="addTodoBtn">+</button>
            </div>

            <div class="todo-grid" id="todoList"></div>

            <!-- Quick Links Section -->
            <div class="section-header">
                <h2>Quick Links</h2>
                <button class="text-btn" id="showLinkForm">Add</button>
            </div>

            <div class="link-input-card" id="linkForm">
                <input type="text" id="linkName" placeholder="Link name">
                <input type="url" id="linkUrl" placeholder="https://example.com">
                <button id="addLinkBtn">Add Link</button>
            </div>

            <div class="links-grid" id="linksList"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
